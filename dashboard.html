<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkHive | Dashboard</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body class="min-h-screen bg-gray-50 font-[Poppins]">

    <!-- Top bar -->
    <header class="bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between">
        <div class="flex items-center gap-2">
            <img src="img/logo.png" class="w-8 h-8 object-contain rounded-full" alt="WorkHive">
            <span class="font-bold text-gray-900">WorkHive</span>
        </div>
        <a href="#logout" id="logoutBtn" class="text-sm font-semibold text-gray-600 hover:text-red-500 transition">
            <i class="fa-solid fa-right-from-bracket mr-1"></i> Logout
        </a>
    </header>

    <!-- Loading state -->
    <div id="loadingState" class="max-w-4xl mx-auto p-6 text-center text-gray-500 text-sm">
        Loading your dashboard...
    </div>

    <!-- Main content (hidden until we confirm the session) -->
    <main id="dashboardContent" class="hidden max-w-4xl mx-auto p-6">
        <div class="bg-white rounded-2xl shadow p-6">
            <h1 class="text-xl font-bold text-gray-900 mb-1">
                Welcome, <span id="userFullName">there</span> 👋
            </h1>
            <p class="text-gray-500 text-sm mb-6" id="userRoleLine"></p>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-sm">
                <div class="border border-gray-200 rounded-lg p-3">
                    <p class="text-gray-400 text-xs mb-0.5">Username</p>
                    <p class="text-gray-900 font-medium" id="userUsername">—</p>
                </div>
                <div class="border border-gray-200 rounded-lg p-3">
                    <p class="text-gray-400 text-xs mb-0.5">Email</p>
                    <p class="text-gray-900 font-medium" id="userEmail">—</p>
                </div>
                <div class="border border-gray-200 rounded-lg p-3">
                    <p class="text-gray-400 text-xs mb-0.5">Phone</p>
                    <p class="text-gray-900 font-medium" id="userPhone">—</p>
                </div>
                <div class="border border-gray-200 rounded-lg p-3">
                    <p class="text-gray-400 text-xs mb-0.5">Member Since</p>
                    <p class="text-gray-900 font-medium" id="userCreatedAt">—</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Logout confirm modal -->
    <div id="logoutModal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl p-6 w-full max-w-sm text-center">
            <h3 class="text-base font-bold text-gray-900 mb-2">Log out of WorkHive?</h3>
            <p class="text-xs text-gray-500 mb-5">You'll need to sign in again to access your dashboard.</p>
            <div class="flex gap-2">
                <button id="cancelLogoutBtn" class="w-1/2 border border-gray-300 text-gray-700 font-semibold py-2 rounded-lg text-xs">Cancel</button>
                <button id="confirmLogoutBtn" class="w-1/2 bg-red-500 hover:bg-red-600 text-white font-semibold py-2 rounded-lg text-xs">Logout</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
